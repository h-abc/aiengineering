name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "=== 检查 index.html 是否存在 ==="
          test -f index.html && echo "✅ index.html 存在" || (echo "❌ index.html 不存在" && exit 1)
          
          echo "=== 检查文件大小 ==="
          size=$(wc -c < index.html)
          echo "文件大小: $size 字节"
          test "$size" -gt 5000 && echo "✅ 文件大小正常" || (echo "❌ 文件太小" && exit 1)
          
          echo "=== 检查关键函数 ==="
          grep -q "parseWechat" index.html && echo "✅ parseWechat 存在" || (echo "❌ parseWechat 缺失" && exit 1)
          grep -q "analyzeSentiment" index.html && echo "✅ analyzeSentiment 存在" || (echo "❌ analyzeSentiment 缺失" && exit 1)
          grep -q "analyzeTopics" index.html && echo "✅ analyzeTopics 存在" || (echo "❌ analyzeTopics 缺失" && exit 1)
          grep -q "analyzeActivity" index.html && echo "✅ analyzeActivity 存在" || (echo "❌ analyzeActivity 缺失" && exit 1)
          
          echo "=== 检查 CDN 依赖 ==="
          grep -q "chart.js" index.html && echo "✅ Chart.js 已引入" || (echo "❌ Chart.js 缺失" && exit 1)
          grep -q "pico" index.html && echo "✅ Pico.css 已引入" || (echo "❌ Pico.css 缺失" && exit 1)
          
          echo ""
          echo "🎉 所有检查通过！"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
